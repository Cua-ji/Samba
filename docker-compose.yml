services:
  postgres:
    image: postgres:16-alpine
    container_name: samba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: samba_db
      POSTGRES_USER: samba
      POSTGRES_PASSWORD: samba_secret
    ports:
      - "5432:5432"
    volumes:
      - samba_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samba -d samba_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: samba-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  samba_pgdata:
